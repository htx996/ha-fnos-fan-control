button_card_templates:
  fn_nas_metric:
    show_icon: true
    show_name: true
    show_state: true
    tap_action:
      action: more-info
    hold_action:
      action: none
    styles:
      card:
        - min-height: 112px
        - padding: 14px
        - border-radius: 0
        - background: transparent
        - border: none
        - box-shadow: none
        - grid-template-areas: '"i n" "i s"'
        - grid-template-columns: 42px 1fr
        - grid-template-rows: 1fr 1fr
      icon:
        - width: 28px
        - color: |
            [[[
              const colors = {
                system: '#44c7d9',
                storage: '#3bc48d',
                disk: '#8bd450',
                fan: '#f0a34a',
                ups: '#e7c64f',
                vm: '#77a9ff',
                docker: '#49b9e8',
                control: '#ef6b68'
              };
              return colors[entity.attributes.fn_nas_dashboard_category] || '#aebbc2';
            ]]]
      name:
        - justify-self: start
        - align-self: end
        - color: "#aebbc2"
        - font-size: 13px
        - white-space: normal
        - text-align: left
      state:
        - justify-self: start
        - align-self: start
        - color: "#f5f7f8"
        - font-size: 20px
        - font-weight: 600
        - white-space: normal
        - text-align: left
    state:
      - value: unavailable
        styles:
          card:
            - opacity: 0.55
      - value: unknown
        styles:
          card:
            - opacity: 0.7

  fn_nas_control:
    template: fn_nas_metric
    styles:
      card:
        - min-height: 88px
        - grid-template-columns: 38px 1fr
      icon:
        - width: 25px
      state:
        - font-size: 16px
