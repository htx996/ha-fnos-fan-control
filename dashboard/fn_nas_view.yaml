title: 飞牛NAS
path: fn-nas
icon: mdi:nas
type: sections
max_columns: 2
background: "#11181c"
card_mod:
  style: |
    :host {
      --primary-background-color: #11181c;
      --secondary-background-color: #11181c;
      --card-background-color: transparent;
      --ha-card-background: transparent;
      --primary-text-color: #f4f7f8;
      --secondary-text-color: #aebbc2;
    }
sections:
  - type: grid
    cards:
      - type: heading
        heading: 系统概览
        heading_style: title
        icon: mdi:view-dashboard-outline
        card_mod:
          style: |
            :host {
              color: #f4f7f8;
              --primary-text-color: #f4f7f8;
              --secondary-text-color: #aebbc2;
            }
        grid_options:
          columns: 12
          rows: 1

      - type: picture
        image: /local/community/fn_nas/fn_nas.png
        alt_text: 飞牛NAS
        tap_action:
          action: none
        hold_action:
          action: none
        grid_options:
          columns: 12
          rows: 5
        card_mod:
          style: |
            ha-card {
              overflow: hidden;
              border-radius: 0;
              border: none;
              background: transparent;
              box-shadow: none;
            }

      - type: custom:auto-entities
        show_empty: false
        card:
          type: grid
          columns: 2
          square: false
        card_param: cards
        filter:
          include:
            - integration: fn_nas
              domain: sensor
              attributes:
                fn_nas_dashboard_category: system
              options:
                type: custom:button-card
                template: fn_nas_metric
        sort:
          method: attribute
          attribute: fn_nas_dashboard_order
          numeric: true

      - type: heading
        heading: 温度趋势
        heading_style: subtitle
        icon: mdi:chart-line
        card_mod:
          style: |
            :host {
              color: #f4f7f8;
              --primary-text-color: #f4f7f8;
              --secondary-text-color: #aebbc2;
            }
        grid_options:
          columns: 12
          rows: 1

      - type: custom:auto-entities
        show_empty: false
        card:
          type: custom:mini-graph-card
          hours_to_show: 24
          points_per_hour: 4
          line_width: 3
          height: 90
          show:
            icon: true
            extrema: true
            fill: fade
          name: CPU 温度
          color_thresholds:
            - value: 35
              color: "#44c7d9"
            - value: 55
              color: "#e7c64f"
            - value: 70
              color: "#ef6b68"
          card_mod:
            style: |
              ha-card {
                border-radius: 0;
                background: transparent;
                border: none;
                box-shadow: none;
                color: #f4f7f8;
                --primary-text-color: #f4f7f8;
                --secondary-text-color: #aebbc2;
              }
        card_param: entities
        filter:
          include:
            - integration: fn_nas
              domain: sensor
              attributes:
                fn_nas_dashboard_role: cpu_temperature

      - type: custom:auto-entities
        show_empty: false
        card:
          type: custom:mini-graph-card
          hours_to_show: 24
          points_per_hour: 4
          line_width: 3
          height: 90
          show:
            icon: true
            extrema: true
            fill: fade
          name: 主板温度
          color_thresholds:
            - value: 30
              color: "#3bc48d"
            - value: 50
              color: "#e7c64f"
            - value: 65
              color: "#ef6b68"
          card_mod:
            style: |
              ha-card {
                border-radius: 0;
                background: transparent;
                border: none;
                box-shadow: none;
                color: #f4f7f8;
                --primary-text-color: #f4f7f8;
                --secondary-text-color: #aebbc2;
              }
        card_param: entities
        filter:
          include:
            - integration: fn_nas
              domain: sensor
              attributes:
                fn_nas_dashboard_role: motherboard_temperature

  - type: grid
    cards:
      - type: heading
        heading: 存储详情
        heading_style: title
        icon: mdi:database-outline
        card_mod:
          style: |
            :host {
              color: #f4f7f8;
              --primary-text-color: #f4f7f8;
              --secondary-text-color: #aebbc2;
            }
        grid_options:
          columns: 12
          rows: 1

      - type: custom:auto-entities
        show_empty: false
        card:
          type: grid
          columns: 2
          square: false
        card_param: cards
        filter:
          include:
            - integration: fn_nas
              domain: sensor
              attributes:
                fn_nas_dashboard_category: storage
              options:
                type: custom:button-card
                template: fn_nas_volume
        sort:
          method: name
          ignore_case: true

      - type: heading
        heading: 硬盘
        heading_style: subtitle
        icon: mdi:harddisk
        card_mod:
          style: |
            :host {
              color: #f4f7f8;
              --primary-text-color: #f4f7f8;
              --secondary-text-color: #aebbc2;
            }
        grid_options:
          columns: 12
          rows: 1

      - type: custom:auto-entities
        show_empty: false
        card:
          type: grid
          columns: 2
          square: false
        card_param: cards
        filter:
          include:
            - integration: fn_nas
              domain: sensor
              attributes:
                fn_nas_dashboard_category: disk
                fn_nas_dashboard_role: temperature
              options:
                type: custom:button-card
                template: fn_nas_disk
        sort:
          method: name
          ignore_case: true

      - type: heading
        heading: UPS
        heading_style: subtitle
        icon: mdi:battery-charging-medium
        card_mod:
          style: |
            :host {
              color: #f4f7f8;
              --primary-text-color: #f4f7f8;
              --secondary-text-color: #aebbc2;
            }
        grid_options:
          columns: 12
          rows: 1

      - type: custom:auto-entities
        show_empty: false
        card:
          type: grid
          columns: 2
          square: false
        card_param: cards
        filter:
          include:
            - integration: fn_nas
              domain: sensor
              attributes:
                fn_nas_dashboard_category: ups
              options:
                type: custom:button-card
                template: fn_nas_metric
        sort:
          method: attribute
          attribute: fn_nas_dashboard_order
          numeric: true

  - type: grid
    cards:
      - type: heading
        heading: 控制
        heading_style: title
        icon: mdi:tune-variant
        card_mod:
          style: |
            :host {
              color: #f4f7f8;
              --primary-text-color: #f4f7f8;
              --secondary-text-color: #aebbc2;
            }
        grid_options:
          columns: 12
          rows: 1

      - type: custom:auto-entities
        show_empty: false
        card:
          type: vertical-stack
        card_param: cards
        filter:
          include:
            - integration: fn_nas
              domain: select
              attributes:
                fn_nas_dashboard_category: control
              options:
                type: tile
                name: 风扇控制模式
                vertical: false
                hide_state: false
                tap_action:
                  action: more-info
                card_mod:
                  style: |
                    ha-card {
                      min-height: 64px;
                      background: transparent;
                      border: none;
                      box-shadow: none;
                      color: #f4f7f8;
                      --primary-text-color: #f4f7f8;
                      --secondary-text-color: #aebbc2;
                    }
        sort:
          method: attribute
          attribute: fn_nas_dashboard_order
          numeric: true

      - type: custom:auto-entities
        show_empty: false
        card:
          type: grid
          columns: 2
          square: false
        card_param: cards
        filter:
          include:
            - integration: fn_nas
              domain: switch
              attributes:
                fn_nas_dashboard_category: control
              options:
                type: custom:button-card
                template: fn_nas_control
                tap_action:
                  action: more-info
            - integration: fn_nas
              domain: button
              attributes:
                fn_nas_dashboard_category: control
              options:
                type: custom:button-card
                template: fn_nas_control
                tap_action:
                  action: more-info
        sort:
          method: attribute
          attribute: fn_nas_dashboard_order
          numeric: true

      - type: heading
        heading: 风扇
        heading_style: subtitle
        icon: mdi:fan
        card_mod:
          style: |
            :host {
              color: #f4f7f8;
              --primary-text-color: #f4f7f8;
              --secondary-text-color: #aebbc2;
            }
        grid_options:
          columns: 12
          rows: 1

      - type: custom:auto-entities
        show_empty: false
        card:
          type: grid
          columns: 2
          square: false
        card_param: cards
        filter:
          include:
            - integration: fn_nas
              domain: sensor
              attributes:
                fn_nas_dashboard_category: fan
                fn_nas_dashboard_role: rpm
              options:
                type: custom:button-card
                template: fn_nas_fan
        sort:
          method: name
          ignore_case: true

      - type: heading
        heading: 虚拟机
        heading_style: subtitle
        icon: mdi:server
        card_mod:
          style: |
            :host {
              color: #f4f7f8;
              --primary-text-color: #f4f7f8;
              --secondary-text-color: #aebbc2;
            }
        grid_options:
          columns: 12
          rows: 1

      - type: custom:auto-entities
        show_empty: false
        card:
          type: grid
          columns: 2
          square: false
        card_param: cards
        filter:
          include:
            - integration: fn_nas
              attributes:
                fn_nas_dashboard_category: vm
              options:
                type: custom:button-card
                template: fn_nas_control
                tap_action:
                  action: more-info
        sort:
          method: name
          ignore_case: true

      - type: heading
        heading: Docker
        heading_style: subtitle
        icon: mdi:docker
        card_mod:
          style: |
            :host {
              color: #f4f7f8;
              --primary-text-color: #f4f7f8;
              --secondary-text-color: #aebbc2;
            }
        grid_options:
          columns: 12
          rows: 1

      - type: custom:auto-entities
        show_empty: false
        card:
          type: grid
          columns: 2
          square: false
        card_param: cards
        filter:
          include:
            - integration: fn_nas
              attributes:
                fn_nas_dashboard_category: docker
              options:
                type: custom:button-card
                template: fn_nas_control
                tap_action:
                  action: more-info
        sort:
          method: name
          ignore_case: true
