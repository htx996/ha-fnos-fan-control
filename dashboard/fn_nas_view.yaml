title: 飞牛NAS
path: fn-nas
icon: mdi:nas
type: sections
max_columns: 2
dense_section_placement: true
background: "#0c1114"
card_mod:
  style: |
    :host {
      --primary-background-color: #0c1114;
      --secondary-background-color: #0c1114;
      --card-background-color: transparent;
      --ha-card-background: transparent;
      --primary-text-color: #f5f5f7;
      --secondary-text-color: #a7adb4;
      --ha-card-border-radius: 8px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
      letter-spacing: 0;
    }
sections:
  - type: grid
    cards:
      - type: heading
        heading: 系统概览
        heading_style: title
        icon: mdi:view-dashboard-outline
        card_mod:
          style: |
            :host {
              color: #f5f5f7;
              --primary-text-color: #f5f5f7;
              --secondary-text-color: #a7adb4;
              border-bottom: 1px solid rgba(255, 255, 255, 0.07);
              padding-bottom: 6px;
              letter-spacing: 0;
            }
        grid_options:
          columns: 12
          rows: 1

      - type: vertical-stack
        cards:
          - type: picture
            image: /local/community/fn_nas/fn_nas.png
            alt_text: 飞牛NAS
            tap_action:
              action: none
            hold_action:
              action: none
            card_mod:
              style: |
                ha-card {
                  height: 100%;
                  overflow: hidden;
                  border-radius: 8px;
                  border: 1px solid rgba(255, 255, 255, 0.055);
                  background: rgba(255, 255, 255, 0.018);
                  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.025);
                }
                ha-card img {
                  width: 100% !important;
                  height: 100% !important;
                  object-fit: contain !important;
                  object-position: center !important;
                }
          - type: custom:auto-entities
            show_empty: false
            card:
              type: grid
              columns: 2
              square: false
            card_param: cards
            filter:
              include:
                - integration: fn_nas
                  domain: switch
                  attributes:
                    fn_nas_dashboard_category: control
                    fn_nas_dashboard_role: power
                  options:
                    type: custom:button-card
                    template: fn_nas_image_action
                    tap_action:
                      action: more-info
                - integration: fn_nas
                  domain: button
                  attributes:
                    fn_nas_dashboard_category: control
                    fn_nas_dashboard_role: reboot
                  options:
                    type: custom:button-card
                    template: fn_nas_image_action
                    tap_action:
                      action: more-info
            sort:
              method: attribute
              attribute: fn_nas_dashboard_order
              numeric: true
        card_mod:
          style: |
            :host {
              position: relative;
            }
            #root {
              position: relative;
            }
            #root > *:nth-child(2) {
              position: absolute;
              top: -60px;
              right: 0;
              width: 96px;
              z-index: 2;
            }
        grid_options:
          columns: 12
          rows: 4

      - type: custom:auto-entities
        show_empty: false
        card:
          type: grid
          columns: 2
          square: false
        card_param: cards
        filter:
          include:
            - integration: fn_nas
              domain: sensor
              attributes:
                fn_nas_dashboard_category: system
              options:
                type: custom:button-card
                template: fn_nas_metric
        sort:
          method: attribute
          attribute: fn_nas_dashboard_order
          numeric: true

  - type: grid
    cards:
      - type: heading
        heading: 运行与控制
        heading_style: title
        icon: mdi:tune-variant
        card_mod:
          style: |
            :host {
              color: #f5f5f7;
              --primary-text-color: #f5f5f7;
              --secondary-text-color: #a7adb4;
              border-bottom: 1px solid rgba(255, 255, 255, 0.07);
              padding-bottom: 6px;
              letter-spacing: 0;
            }
        grid_options:
          columns: 12
          rows: 1

      - type: custom:auto-entities
        show_empty: false
        card:
          type: entities
          state_color: true
          card_mod:
            style: |
              ha-card {
                background: rgba(255, 255, 255, 0.045);
                border: 1px solid rgba(255, 255, 255, 0.07);
                border-radius: 8px;
                box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.035), 0 8px 24px rgba(0, 0, 0, 0.08);
                backdrop-filter: blur(18px) saturate(130%);
                color: #f5f5f7;
                --primary-text-color: #f5f5f7;
                --secondary-text-color: #a7adb4;
              }
              #states {
                padding: 2px 10px !important;
              }
        card_param: entities
        filter:
          include:
            - integration: fn_nas
              domain: select
              attributes:
                fn_nas_dashboard_category: control
              options:
                name: 风扇控制模式
        sort:
          method: attribute
          attribute: fn_nas_dashboard_order
          numeric: true

      - type: heading
        heading: 风扇
        heading_style: subtitle
        icon: mdi:fan
        card_mod:
          style: |
            :host {
              color: #c8cdd2;
              --primary-text-color: #c8cdd2;
              --secondary-text-color: #9098a0;
              letter-spacing: 0;
            }
        grid_options:
          columns: 12
          rows: 1

      - type: custom:auto-entities
        show_empty: false
        card:
          type: grid
          columns: 2
          square: false
        card_param: cards
        filter:
          include:
            - integration: fn_nas
              domain: sensor
              attributes:
                fn_nas_dashboard_category: fan
                fn_nas_dashboard_role: rpm
              options:
                type: custom:button-card
                template: fn_nas_fan
        sort:
          method: name
          ignore_case: true

  - type: grid
    cards:
      - type: heading
        heading: 运行监控
        heading_style: title
        icon: mdi:chart-line
        card_mod:
          style: |
            :host {
              color: #f5f5f7;
              --primary-text-color: #f5f5f7;
              --secondary-text-color: #a7adb4;
              border-bottom: 1px solid rgba(255, 255, 255, 0.07);
              padding-bottom: 6px;
              letter-spacing: 0;
            }
        grid_options:
          columns: 12
          rows: 1

      - type: custom:auto-entities
        show_empty: false
        card:
          type: custom:mini-graph-card
          hours_to_show: 24
          points_per_hour: 4
          line_width: 3
          height: 64
          show:
            icon: true
            extrema: true
            fill: fade
          name: CPU 温度
          color_thresholds:
            - value: 35
              color: "#44c7d9"
            - value: 55
              color: "#e7c64f"
            - value: 70
              color: "#ef6b68"
          card_mod:
            style: |
              ha-card {
                border-radius: 8px;
                background: rgba(255, 255, 255, 0.035);
                border: 1px solid rgba(255, 255, 255, 0.06);
                box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
                backdrop-filter: blur(16px) saturate(125%);
                color: #f5f5f7;
                --primary-text-color: #f5f5f7;
                --secondary-text-color: #a7adb4;
              }
        card_param: entities
        filter:
          include:
            - integration: fn_nas
              domain: sensor
              attributes:
                fn_nas_dashboard_role: cpu_temperature

      - type: custom:auto-entities
        show_empty: false
        card:
          type: custom:mini-graph-card
          hours_to_show: 24
          points_per_hour: 4
          line_width: 3
          height: 64
          show:
            icon: true
            extrema: true
            fill: fade
          name: 主板温度
          color_thresholds:
            - value: 30
              color: "#3bc48d"
            - value: 50
              color: "#e7c64f"
            - value: 65
              color: "#ef6b68"
          card_mod:
            style: |
              ha-card {
                border-radius: 8px;
                background: rgba(255, 255, 255, 0.035);
                border: 1px solid rgba(255, 255, 255, 0.06);
                box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
                backdrop-filter: blur(16px) saturate(125%);
                color: #f5f5f7;
                --primary-text-color: #f5f5f7;
                --secondary-text-color: #a7adb4;
              }
        card_param: entities
        filter:
          include:
            - integration: fn_nas
              domain: sensor
              attributes:
                fn_nas_dashboard_role: motherboard_temperature

      - type: heading
        heading: UPS
        heading_style: subtitle
        icon: mdi:battery-charging-medium
        card_mod:
          style: |
            :host {
              color: #c8cdd2;
              --primary-text-color: #c8cdd2;
              --secondary-text-color: #9098a0;
              letter-spacing: 0;
            }
        grid_options:
          columns: 12
          rows: 1

      - type: custom:auto-entities
        show_empty: false
        card:
          type: grid
          columns: 2
          square: false
        card_param: cards
        filter:
          include:
            - integration: fn_nas
              domain: sensor
              attributes:
                fn_nas_dashboard_category: ups
              options:
                type: custom:button-card
                template: fn_nas_metric
        sort:
          method: attribute
          attribute: fn_nas_dashboard_order
          numeric: true

  - type: grid
    cards:
      - type: heading
        heading: 设备详情
        heading_style: title
        icon: mdi:database-outline
        card_mod:
          style: |
            :host {
              color: #f5f5f7;
              --primary-text-color: #f5f5f7;
              --secondary-text-color: #a7adb4;
              border-bottom: 1px solid rgba(255, 255, 255, 0.07);
              padding-bottom: 6px;
              letter-spacing: 0;
            }
        grid_options:
          columns: 12
          rows: 1

      - type: heading
        heading: 存储空间
        heading_style: subtitle
        icon: mdi:database
        card_mod:
          style: |
            :host {
              color: #c8cdd2;
              --primary-text-color: #c8cdd2;
              --secondary-text-color: #9098a0;
              letter-spacing: 0;
            }
        grid_options:
          columns: 12
          rows: 1

      - type: custom:auto-entities
        show_empty: false
        card:
          type: grid
          columns: 2
          square: false
        card_param: cards
        filter:
          include:
            - integration: fn_nas
              domain: sensor
              attributes:
                fn_nas_dashboard_category: storage
              options:
                type: custom:button-card
                template: fn_nas_volume
        sort:
          method: name
          ignore_case: true

      - type: heading
        heading: 硬盘
        heading_style: subtitle
        icon: mdi:harddisk
        card_mod:
          style: |
            :host {
              color: #c8cdd2;
              --primary-text-color: #c8cdd2;
              --secondary-text-color: #9098a0;
              letter-spacing: 0;
            }
        grid_options:
          columns: 12
          rows: 1

      - type: custom:auto-entities
        show_empty: false
        card:
          type: grid
          columns: 2
          square: false
        card_param: cards
        filter:
          include:
            - integration: fn_nas
              domain: sensor
              attributes:
                fn_nas_dashboard_category: disk
                fn_nas_dashboard_role: temperature
              options:
                type: custom:button-card
                template: fn_nas_disk
        sort:
          method: name
          ignore_case: true

      - type: heading
        heading: 虚拟机与容器
        heading_style: subtitle
        icon: mdi:server
        card_mod:
          style: |
            :host {
              color: #c8cdd2;
              --primary-text-color: #c8cdd2;
              --secondary-text-color: #9098a0;
              letter-spacing: 0;
            }
        grid_options:
          columns: 12
          rows: 1

      - type: custom:auto-entities
        show_empty: false
        card:
          type: grid
          columns: 2
          square: false
        card_param: cards
        filter:
          include:
            - integration: fn_nas
              attributes:
                fn_nas_dashboard_category: vm
              options:
                type: custom:button-card
                template: fn_nas_control
                tap_action:
                  action: more-info
            - integration: fn_nas
              attributes:
                fn_nas_dashboard_category: docker
              options:
                type: custom:button-card
                template: fn_nas_control
                tap_action:
                  action: more-info
        sort:
          method: name
          ignore_case: true
