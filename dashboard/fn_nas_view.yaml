title: 飞牛NAS
path: fn-nas
icon: mdi:nas
type: sections
max_columns: 2
dense_section_placement: true
background: "#11181c"
card_mod:
  style: |
    :host {
      --primary-background-color: #11181c;
      --secondary-background-color: #11181c;
      --card-background-color: transparent;
      --ha-card-background: transparent;
      --primary-text-color: #f4f7f8;
      --secondary-text-color: #aebbc2;
    }
sections:
  - type: grid
    cards:
      - type: heading
        heading: 系统概览
        heading_style: title
        icon: mdi:view-dashboard-outline
        card_mod:
          style: |
            :host {
              color: #f4f7f8;
              --primary-text-color: #f4f7f8;
              --secondary-text-color: #aebbc2;
            }
        grid_options:
          columns: 12
          rows: 1

      - type: vertical-stack
        cards:
          - type: picture
            image: /local/community/fn_nas/fn_nas.png
            alt_text: 飞牛NAS
            tap_action:
              action: none
            hold_action:
              action: none
            card_mod:
              style: |
                ha-card {
                  height: 100%;
                  overflow: hidden;
                  border-radius: 0;
                  border: none;
                  background: transparent;
                  box-shadow: none;
                }
                ha-card img {
                  width: 100% !important;
                  height: 100% !important;
                  object-fit: contain !important;
                  object-position: center !important;
                }
          - type: custom:auto-entities
            show_empty: false
            card:
              type: grid
              columns: 3
              square: false
            card_param: cards
            filter:
              include:
                - integration: fn_nas
                  domain: button
                  attributes:
                    fn_nas_dashboard_category: control
                    fn_nas_dashboard_role: power_on
                  options:
                    type: custom:button-card
                    template: fn_nas_image_action
                    tap_action:
                      action: more-info
                - integration: fn_nas
                  domain: button
                  attributes:
                    fn_nas_dashboard_category: control
                    fn_nas_dashboard_role: power_off
                  options:
                    type: custom:button-card
                    template: fn_nas_image_action
                    tap_action:
                      action: more-info
                - integration: fn_nas
                  domain: button
                  attributes:
                    fn_nas_dashboard_category: control
                    fn_nas_dashboard_role: reboot
                  options:
                    type: custom:button-card
                    template: fn_nas_image_action
                    tap_action:
                      action: more-info
            sort:
              method: attribute
              attribute: fn_nas_dashboard_order
              numeric: true
        card_mod:
          style: |
            :host {
              position: relative;
            }
            #root {
              position: relative;
            }
            #root > *:nth-child(2) {
              position: absolute;
              top: -60px;
              right: 0;
              width: 144px;
              z-index: 2;
            }
        grid_options:
          columns: 12
          rows: 4

      - type: custom:auto-entities
        show_empty: false
        card:
          type: grid
          columns: 2
          square: false
        card_param: cards
        filter:
          include:
            - integration: fn_nas
              domain: sensor
              attributes:
                fn_nas_dashboard_category: system
              options:
                type: custom:button-card
                template: fn_nas_metric
        sort:
          method: attribute
          attribute: fn_nas_dashboard_order
          numeric: true

  - type: grid
    cards:
      - type: heading
        heading: 运行与控制
        heading_style: title
        icon: mdi:tune-variant
        card_mod:
          style: |
            :host {
              color: #f4f7f8;
              --primary-text-color: #f4f7f8;
              --secondary-text-color: #aebbc2;
            }
        grid_options:
          columns: 12
          rows: 1

      - type: custom:auto-entities
        show_empty: false
        card:
          type: entities
          state_color: true
          card_mod:
            style: |
              ha-card {
                background: transparent;
                border: none;
                box-shadow: none;
                color: #f4f7f8;
                --primary-text-color: #f4f7f8;
                --secondary-text-color: #aebbc2;
              }
              #states {
                padding: 0 8px !important;
              }
        card_param: entities
        filter:
          include:
            - integration: fn_nas
              domain: select
              attributes:
                fn_nas_dashboard_category: control
              options:
                name: 风扇控制模式
        sort:
          method: attribute
          attribute: fn_nas_dashboard_order
          numeric: true

      - type: heading
        heading: 风扇
        heading_style: subtitle
        icon: mdi:fan
        card_mod:
          style: |
            :host {
              color: #f4f7f8;
              --primary-text-color: #f4f7f8;
              --secondary-text-color: #aebbc2;
            }
        grid_options:
          columns: 12
          rows: 1

      - type: custom:auto-entities
        show_empty: false
        card:
          type: grid
          columns: 2
          square: false
        card_param: cards
        filter:
          include:
            - integration: fn_nas
              domain: sensor
              attributes:
                fn_nas_dashboard_category: fan
                fn_nas_dashboard_role: rpm
              options:
                type: custom:button-card
                template: fn_nas_fan
        sort:
          method: name
          ignore_case: true

  - type: grid
    cards:
      - type: heading
        heading: 运行监控
        heading_style: title
        icon: mdi:chart-line
        card_mod:
          style: |
            :host {
              color: #f4f7f8;
              --primary-text-color: #f4f7f8;
              --secondary-text-color: #aebbc2;
            }
        grid_options:
          columns: 12
          rows: 1

      - type: custom:auto-entities
        show_empty: false
        card:
          type: custom:mini-graph-card
          hours_to_show: 24
          points_per_hour: 4
          line_width: 3
          height: 64
          show:
            icon: true
            extrema: true
            fill: fade
          name: CPU 温度
          color_thresholds:
            - value: 35
              color: "#44c7d9"
            - value: 55
              color: "#e7c64f"
            - value: 70
              color: "#ef6b68"
          card_mod:
            style: |
              ha-card {
                border-radius: 0;
                background: transparent;
                border: none;
                box-shadow: none;
                color: #f4f7f8;
                --primary-text-color: #f4f7f8;
                --secondary-text-color: #aebbc2;
              }
        card_param: entities
        filter:
          include:
            - integration: fn_nas
              domain: sensor
              attributes:
                fn_nas_dashboard_role: cpu_temperature

      - type: custom:auto-entities
        show_empty: false
        card:
          type: custom:mini-graph-card
          hours_to_show: 24
          points_per_hour: 4
          line_width: 3
          height: 64
          show:
            icon: true
            extrema: true
            fill: fade
          name: 主板温度
          color_thresholds:
            - value: 30
              color: "#3bc48d"
            - value: 50
              color: "#e7c64f"
            - value: 65
              color: "#ef6b68"
          card_mod:
            style: |
              ha-card {
                border-radius: 0;
                background: transparent;
                border: none;
                box-shadow: none;
                color: #f4f7f8;
                --primary-text-color: #f4f7f8;
                --secondary-text-color: #aebbc2;
              }
        card_param: entities
        filter:
          include:
            - integration: fn_nas
              domain: sensor
              attributes:
                fn_nas_dashboard_role: motherboard_temperature

      - type: heading
        heading: UPS
        heading_style: subtitle
        icon: mdi:battery-charging-medium
        card_mod:
          style: |
            :host {
              color: #f4f7f8;
              --primary-text-color: #f4f7f8;
              --secondary-text-color: #aebbc2;
            }
        grid_options:
          columns: 12
          rows: 1

      - type: custom:auto-entities
        show_empty: false
        card:
          type: grid
          columns: 2
          square: false
        card_param: cards
        filter:
          include:
            - integration: fn_nas
              domain: sensor
              attributes:
                fn_nas_dashboard_category: ups
              options:
                type: custom:button-card
                template: fn_nas_metric
        sort:
          method: attribute
          attribute: fn_nas_dashboard_order
          numeric: true

  - type: grid
    cards:
      - type: heading
        heading: 设备详情
        heading_style: title
        icon: mdi:database-outline
        card_mod:
          style: |
            :host {
              color: #f4f7f8;
              --primary-text-color: #f4f7f8;
              --secondary-text-color: #aebbc2;
            }
        grid_options:
          columns: 12
          rows: 1

      - type: heading
        heading: 存储空间
        heading_style: subtitle
        icon: mdi:database
        card_mod:
          style: |
            :host {
              color: #f4f7f8;
              --primary-text-color: #f4f7f8;
              --secondary-text-color: #aebbc2;
            }
        grid_options:
          columns: 12
          rows: 1

      - type: custom:auto-entities
        show_empty: false
        card:
          type: grid
          columns: 2
          square: false
        card_param: cards
        filter:
          include:
            - integration: fn_nas
              domain: sensor
              attributes:
                fn_nas_dashboard_category: storage
              options:
                type: custom:button-card
                template: fn_nas_volume
        sort:
          method: name
          ignore_case: true

      - type: heading
        heading: 硬盘
        heading_style: subtitle
        icon: mdi:harddisk
        card_mod:
          style: |
            :host {
              color: #f4f7f8;
              --primary-text-color: #f4f7f8;
              --secondary-text-color: #aebbc2;
            }
        grid_options:
          columns: 12
          rows: 1

      - type: custom:auto-entities
        show_empty: false
        card:
          type: grid
          columns: 2
          square: false
        card_param: cards
        filter:
          include:
            - integration: fn_nas
              domain: sensor
              attributes:
                fn_nas_dashboard_category: disk
                fn_nas_dashboard_role: temperature
              options:
                type: custom:button-card
                template: fn_nas_disk
        sort:
          method: name
          ignore_case: true

      - type: heading
        heading: 虚拟机与容器
        heading_style: subtitle
        icon: mdi:server
        card_mod:
          style: |
            :host {
              color: #f4f7f8;
              --primary-text-color: #f4f7f8;
              --secondary-text-color: #aebbc2;
            }
        grid_options:
          columns: 12
          rows: 1

      - type: grid
        columns: 1
        square: false
        cards:
          - type: custom:mod-card
            card_mod:
              style: |
                ha-card {
                  padding: 7px;
                  border: 1px solid rgba(119, 169, 255, 0.14);
                  border-radius: 8px;
                  background: #172126;
                  box-shadow: none;
                }
            card:
              type: vertical-stack
              cards:
                - type: custom:auto-entities
                  show_empty: false
                  card:
                    type: grid
                    columns: 1
                    square: false
                  card_param: cards
                  filter:
                    include:
                      - integration: fn_nas
                        domain: sensor
                        name: Homeassistant 状态
                        attributes:
                          fn_nas_dashboard_category: vm
                          fn_nas_dashboard_role: status
                        options:
                          type: custom:button-card
                          template: fn_nas_vm_system
                          icon: mdi:home-assistant
                          variables:
                            brand_color: "#41bdf5"
                            brand_background: rgba(65, 189, 245, 0.12)
                - type: custom:auto-entities
                  show_empty: false
                  card:
                    type: grid
                    columns: 2
                    square: false
                  card_param: cards
                  filter:
                    include:
                      - integration: fn_nas
                        domain: button
                        name: Homeassistant 开机
                        attributes:
                          fn_nas_dashboard_category: vm
                          fn_nas_dashboard_role: power_on
                        options:
                          type: custom:button-card
                          template: fn_nas_vm_action
                      - integration: fn_nas
                        domain: button
                        name: Homeassistant 关机
                        attributes:
                          fn_nas_dashboard_category: vm
                          fn_nas_dashboard_role: power_off
                        options:
                          type: custom:button-card
                          template: fn_nas_vm_action

          - type: custom:mod-card
            card_mod:
              style: |
                ha-card {
                  padding: 7px;
                  border: 1px solid rgba(11, 99, 246, 0.18);
                  border-radius: 8px;
                  background: #172126;
                  box-shadow: none;
                }
            card:
              type: vertical-stack
              cards:
                - type: custom:auto-entities
                  show_empty: false
                  card:
                    type: grid
                    columns: 1
                    square: false
                  card_param: cards
                  filter:
                    include:
                      - integration: fn_nas
                        domain: sensor
                        name: iStoreOS 状态
                        attributes:
                          fn_nas_dashboard_category: vm
                          fn_nas_dashboard_role: status
                        options:
                          type: custom:button-card
                          template: fn_nas_vm_system
                          show_entity_picture: true
                          entity_picture: /local/community/fn_nas/istoreos.png?v=138
                          variables:
                            brand_color: "#0b63f6"
                            brand_background: rgba(11, 99, 246, 0.14)
                - type: custom:auto-entities
                  show_empty: false
                  card:
                    type: grid
                    columns: 2
                    square: false
                  card_param: cards
                  filter:
                    include:
                      - integration: fn_nas
                        domain: button
                        name: iStoreOS 开机
                        attributes:
                          fn_nas_dashboard_category: vm
                          fn_nas_dashboard_role: power_on
                        options:
                          type: custom:button-card
                          template: fn_nas_vm_action
                      - integration: fn_nas
                        domain: button
                        name: iStoreOS 关机
                        attributes:
                          fn_nas_dashboard_category: vm
                          fn_nas_dashboard_role: power_off
                        options:
                          type: custom:button-card
                          template: fn_nas_vm_action

          - type: custom:mod-card
            card_mod:
              style: |
                ha-card {
                  padding: 7px;
                  border: 1px solid rgba(0, 120, 212, 0.18);
                  border-radius: 8px;
                  background: #172126;
                  box-shadow: none;
                }
            card:
              type: vertical-stack
              cards:
                - type: custom:auto-entities
                  show_empty: false
                  card:
                    type: grid
                    columns: 1
                    square: false
                  card_param: cards
                  filter:
                    include:
                      - integration: fn_nas
                        domain: sensor
                        name: Windows 10 状态
                        attributes:
                          fn_nas_dashboard_category: vm
                          fn_nas_dashboard_role: status
                        options:
                          type: custom:button-card
                          template: fn_nas_vm_system
                          icon: mdi:microsoft-windows
                          variables:
                            brand_color: "#45a7f5"
                            brand_background: rgba(0, 120, 212, 0.14)
                - type: custom:auto-entities
                  show_empty: false
                  card:
                    type: grid
                    columns: 2
                    square: false
                  card_param: cards
                  filter:
                    include:
                      - integration: fn_nas
                        domain: button
                        name: Windows 10 开机
                        attributes:
                          fn_nas_dashboard_category: vm
                          fn_nas_dashboard_role: power_on
                        options:
                          type: custom:button-card
                          template: fn_nas_vm_action
                      - integration: fn_nas
                        domain: button
                        name: Windows 10 关机
                        attributes:
                          fn_nas_dashboard_category: vm
                          fn_nas_dashboard_role: power_off
                        options:
                          type: custom:button-card
                          template: fn_nas_vm_action
        grid_options:
          columns: 12

      - type: custom:auto-entities
        show_empty: false
        card:
          type: grid
          columns: 2
          square: false
        card_param: cards
        filter:
          include:
            - integration: fn_nas
              attributes:
                fn_nas_dashboard_category: docker
                fn_nas_dashboard_role: status
              options:
                type: custom:button-card
                template: fn_nas_control
            - integration: fn_nas
              attributes:
                fn_nas_dashboard_category: docker
                fn_nas_dashboard_role: power_on
              options:
                type: custom:button-card
                template: fn_nas_control
                tap_action:
                  action: more-info
            - integration: fn_nas
              attributes:
                fn_nas_dashboard_category: docker
                fn_nas_dashboard_role: power_off
              options:
                type: custom:button-card
                template: fn_nas_control
                tap_action:
                  action: more-info
        sort:
          method: name
          ignore_case: true
